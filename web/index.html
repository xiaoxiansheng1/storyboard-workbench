<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分镜工作台</title>
    <script>
      try {
        var theme = localStorage.getItem('storyboard-theme');
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="preload" href="/fonts/harmonyos-sans-sc/HarmonyOS_Sans_SC_Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/harmonyos-sans-sc/HarmonyOS_Sans_SC_Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/harmonyos-sans-sc/HarmonyOS_Sans_SC_Bold.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
